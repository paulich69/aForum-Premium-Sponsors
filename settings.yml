sponsors:
  type: objects
  default: []
  schema:
    name: sponsor
    properties:
      name:
        type: string
        required: true
      url:
        type: string
        required: true
        validations:
          url: true
      image:
        type: upload
      image_url:
        type: string
      tagline:
        type: string
      mode:
        type: enum
        choices:
          - banner
          - logo
      background:
        type: string
      active:
        type: boolean
      position:
        type: integer
      mobile_weight:
        type: integer
        validations:
          min: 0
          max: 20
show_on_categories:
  type: bool
  default: true

# Einheitliche Hoehe aller Sponsor-Kacheln in Pixeln.
tile_height:
  type: integer
  default: 125
  min: 90
  max: 300

# Eckenradius aller Sponsor-Kacheln in Pixeln.
corner_radius:
  type: integer
  default: 7
  min: 0
  max: 40

# Farbe der Kennzeichnung WERBUNG (HEX).
ad_label_color:
  type: string
  default: "#D6B36A"

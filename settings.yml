sponsors:
  type: objects
  default: []
  schema:
    name: sponsor
    properties:
      name:
        type: string
        required: true
      url:
        type: string
        required: true
        validations:
          url: true
      image:
        type: upload
      image_url:
        type: string
      tagline:
        type: string
      mode:
        type: enum
        choices:
          - banner
          - logo
      background:
        type: string
      active:
        type: boolean
      position:
        type: integer
show_on_categories:
  type: bool
  default: true
